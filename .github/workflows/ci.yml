name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra service
      - name: Lint Python
        run: make lint
      - name: Check Python formatting
        run: uv run ruff format --check src/agent_native_graph tests examples docs/site/social_preview.py
      - name: Check browser script syntax
        run: |
          node --check docs/site/site.js
          node --check docs/site/results.js
          node --check docs/site/results-ui.js
          node --check docs/site/comparison.js

  tests:
    name: Code Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --locked --extra dev --extra service
      - name: Run Python tests
        run: make test
      - name: Run browser script tests
        run: node --test tests/docs_results_ui.test.cjs

  documentation:
    name: Documentation
    needs: tests
    uses: ./.github/workflows/docs.yml
    with:
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: documentation
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
