name: CI and Research Website

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "paper/**"
      - "examples/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "Dockerfile"
      - "Makefile"
      - "results/**"
      - "src/agent_native_graph/**"
      - "tests/**"
      - "data/reference_company100_qids.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "docs/**"
      - "paper/**"
      - "examples/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "Dockerfile"
      - "Makefile"
      - "results/**"
      - "src/agent_native_graph/**"
      - "tests/**"
      - "data/reference_company100_qids.json"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code_checks:
    name: Code Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Documentation
    needs: code_checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra dev --extra service
      - name: Read pinned comparison source
        id: reference
        run: python -c 'import json; d=json.load(open("docs/site/comparison-source.json")); print("repository="+d["repository"]); print("commit="+d["commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: ${{ steps.reference.outputs.repository }}
          ref: ${{ steps.reference.outputs.commit }}
          path: build/reference
          persist-credentials: false
      - name: Build static site
        run: uv run agent-native-graph build-docs --out build/site --reference-repo build/reference
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/site

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
