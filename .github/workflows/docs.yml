name: Documentation Build

on:
  workflow_call:
    inputs:
      publish:
        description: Upload the release artifact; only allowed on main outside pull requests.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.publish && 'Build Release Documentation' || 'Check Documentation Build' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra dev --extra service
      - name: Read pinned comparison source
        id: reference
        run: python -c 'import json; d=json.load(open("docs/site/comparison-source.json")); print("repository="+d["repository"]); print("commit="+d["commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.reference.outputs.repository }}
          ref: ${{ steps.reference.outputs.commit }}
          path: build/reference
          persist-credentials: false
      - name: Build static site
        run: make docs-build DOCS_OUT=build/site REFERENCE_REPO=build/reference
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: inputs.publish && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/site
          include-hidden-files: true

