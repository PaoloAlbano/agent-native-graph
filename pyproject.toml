[project]
name = "agent-native-graph"
version = "0.1.1"
description = "Research prototype for Agent-Native APIs over knowledge graphs."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { email = "paoloalbano90@gmail.com" },
]
dependencies = [
  "httpx>=0.27",
  "neo4j>=5.0",
  "PyYAML>=6.0",
]

[project.scripts]
agent-native-graph = "agent_native_graph.interfaces.cli:main"

[project.optional-dependencies]
reference = [
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "rapidfuzz>=3.9",
  "rich>=13.7",
  "tenacity>=9.0",
  "typer>=0.12",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
service = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
mcp = [
  "mcp>=1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_native_graph"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/pyproject.toml", "/uv.lock", "/README.md", "/LICENSE"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B904",
  "E501",
]
